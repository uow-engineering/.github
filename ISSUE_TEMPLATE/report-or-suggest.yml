name: Report a problem or suggest a change
description: Something doesn't work, is unclear, or could be better.
title: ""
body:
  - type: textarea
    id: what
    attributes:
      label: What's the problem or idea?
      description: What happened (or what you'd like), and what you expected instead.
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where?
      description: File, part or rig, if you know.
